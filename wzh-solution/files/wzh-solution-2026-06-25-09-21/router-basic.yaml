version: v0.3

listeners:
  - name: http-8888
    address: 0.0.0.0
    port: 8888
    timeout: 600s

providers:
  defaults:
    default_model: qwen35-2b
    default_reasoning_effort: low
    reasoning_families:
      qwen3:
        type: chat_template_kwargs
        parameter: enable_thinking
  models:
    - name: qwen35-2b
      provider_model_id: qwen35-2b
      api_format: openai
      reasoning_family: qwen3
      backend_refs:
        - name: qwen35-2b-vllm
          endpoint: vsr-qwen35-2b:8000
          protocol: http
          weight: 100
    - name: qwen35-27b-fp8
      provider_model_id: qwen35-27b-fp8
      api_format: openai
      reasoning_family: qwen3
      backend_refs:
        - name: qwen35-27b-fp8-vllm
          endpoint: vsr-qwen35-27b-fp8:8000
          protocol: http
          weight: 100

routing:
  modelCards:
    - name: qwen35-2b
      param_size: 2B
      context_window_size: 8192
      description: Fast and low-cost lane for simple customer requests.
      capabilities: [chat]
      quality_score: 0.62
      modality: ar
      tags: [small, fast]
    - name: qwen35-27b-fp8
      param_size: 27B
      context_window_size: 4096
      description: Larger FP8 lane for complex reasoning, code, math, and analysis.
      capabilities: [chat, reasoning, code]
      quality_score: 0.91
      modality: ar
      tags: [large, reasoning]

  signals:
    keywords:
      - name: large_task_keywords
        operator: OR
        method: bm25
        keywords:
          - proof
          - prove
          - theorem
          - derive
          - calculus
          - algorithm
          - debug
          - refactor
          - architecture
          - benchmark
          - root cause
          - multi step
          - tradeoff
          - complex
          - 推理
          - 证明
          - 架构
          - 调试
          - 算法
        case_sensitive: false
        bm25_threshold: 0.05
      - name: small_task_keywords
        operator: OR
        method: bm25
        keywords:
          - hello
          - summarize
          - translate
          - rewrite
          - short
          - concise
          - greeting
          - 简短
          - 翻译
          - 总结
        case_sensitive: false
        bm25_threshold: 0.05

  decisions:
    - name: route-large-keyword
      description: Route obviously complex, reasoning, code, or architecture requests to the larger FP8 backend.
      priority: 300
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: large_task_keywords
      modelRefs:
        - model: qwen35-27b-fp8
          use_reasoning: true
          reasoning_effort: medium
    - name: route-small-keyword
      description: Route explicitly short or simple requests to the small backend.
      priority: 200
      rules:
        operator: AND
        conditions:
          - type: keyword
            name: small_task_keywords
      modelRefs:
        - model: qwen35-2b
          use_reasoning: false
    - name: default-small
      description: Conservative default for unclassified traffic.
      priority: 0
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: qwen35-2b
          use_reasoning: false
