version: v0.3

listeners:
  - name: http-8888
    address: 0.0.0.0
    port: 8888
    timeout: 600s

providers:
  defaults:
    default_model: qwen35-2b
    default_reasoning_effort: low
    reasoning_families:
      qwen3:
        type: chat_template_kwargs
        parameter: enable_thinking
  models:
    - name: qwen35-2b
      provider_model_id: qwen35-2b
      api_format: openai
      reasoning_family: qwen3
      pricing:
        currency: USD
        prompt_per_1m: 0.20
        cached_input_per_1m: 0.05
        completion_per_1m: 0.40
      backend_refs:
        - name: qwen35-2b-vllm
          endpoint: vsr-qwen35-2b:8000
          protocol: http
          weight: 100

routing:
  modelCards:
    - name: qwen35-2b
      param_size: 2B
      context_window_size: 4096
      description: Low-cost model for request-parameter budget route validation.
      capabilities: [chat, fast-response, low-cost]
      quality_score: 0.62
      modality: ar
      tags: [small, cheap]

  decisions:
    - name: budget-request-params
      priority: 900
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: qwen35-2b
          use_reasoning: false
      plugins:
        - type: request_params
          configuration:
            blocked_params: ["logprobs", "top_logprobs"]
            max_tokens_limit: 16
            max_n: 1
            strip_unknown: true

global:
  router:
    config_source: file
    strategy: priority
    auto_model_name: budget-request-auto
    include_config_models_in_list: true
