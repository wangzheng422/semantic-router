version: v0.3

listeners:
  - name: http-8888
    address: 0.0.0.0
    port: 8888
    timeout: 60s

providers:
  defaults:
    default_model: qwen35-2b
  models:
    - name: qwen35-2b
      provider_model_id: qwen35-2b
      api_format: openai
      backend_refs:
        - name: mock-small
          endpoint: vsr-mock-backend:8000
          protocol: http
          weight: 100

routing:
  modelCards:
    - name: qwen35-2b
      param_size: 2B
      context_window_size: 4096
      description: Mock small lane.
      capabilities: [chat]
      quality_score: 0.6
      modality: ar
      tags: [small]

  decisions:
    - name: p0-fast-response
      priority: 1000
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: qwen35-2b
      plugins:
        - type: fast_response
          configuration:
            message: "ROUND9_FAST_RESPONSE"

global:
  router:
    config_source: file
    strategy: priority
    auto_model_name: round9-fast-response-auto
    include_config_models_in_list: true
