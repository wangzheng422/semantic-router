version: v0.3

listeners:
  - name: http-8888
    address: 0.0.0.0
    port: 8888
    timeout: 60s

providers:
  defaults:
    default_model: qwen35-2b
  models:
    - name: qwen35-2b
      provider_model_id: qwen35-2b
      api_format: openai
      backend_refs:
        - name: mock-small
          endpoint: vsr-mock-backend:8000
          protocol: http
          weight: 100

routing:
  modelCards:
    - name: qwen35-2b
      param_size: 2B
      context_window_size: 4096
      description: Mock small lane.
      capabilities: [chat]
      quality_score: 0.60
      modality: ar
      tags: [small]

  decisions:
    - name: p1-rag-only
      priority: 1000
      rules:
        operator: AND
        conditions: []
      modelRefs:
        - model: qwen35-2b
      plugins:
        - type: rag
          configuration:
            enabled: true
            backend: external_api
            top_k: 1
            similarity_threshold: 0.1
            injection_mode: system_prompt
            on_failure: warn
            backend_config:
              endpoint: "http://vsr-mock-backend:8000/rag/search"
              request_format: custom
              request_template: '{"query":"{{.Query}}","top_k":{{.TopK}},"threshold":{{.Threshold}}}'
              timeout_seconds: 5
        - type: router_replay
          configuration:
            enabled: true
            max_records: 100
            capture_request_body: true
            capture_response_body: true
            max_body_bytes: 20000

global:
  router:
    config_source: file
    strategy: priority
    auto_model_name: round9-rag-only-auto
    include_config_models_in_list: true
  services:
    router_replay:
      enabled: true
      store_backend: memory
      ttl_seconds: 3600
